name: Fetch racing & sport feeds

on:
  schedule:
    # times are UTC; Australian eastern is UTC+10 (AEST) / +11 (AEDT)
    - cron: '0 20 * * *'   # ~6am AEST
    - cron: '0 8 * * *'    # ~6pm AEST
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feeds
        run: python scripts/fetch_feeds.py

      - name: Commit only if the feed actually changed
        run: |
          git config user.name  "pic-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "Update racing & sport feeds [skip ci]"
            git push
          fi
